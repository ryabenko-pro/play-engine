name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck, editor and player, sync server.
      - run: npm run build
      # Engine, blocks, merging; the server tests use the git on the runner.
      - run: npm test
